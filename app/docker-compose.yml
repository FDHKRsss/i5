services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civil42}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civil42}
      POSTGRES_DB: ${POSTGRES_DB:-civil42}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civil42} -d ${POSTGRES_DB:-civil42}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      # 81 is the Cloudflare Quick Tunnel origin (see docs/ARCHITECTURE.md).
      PORT: 81
      DATABASE_URL: postgres://${POSTGRES_USER:-civil42}:${POSTGRES_PASSWORD:-civil42}@db:5432/${POSTGRES_DB:-civil42}
      GEO_PROVIDER: ${GEO_PROVIDER:-mock}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-15728640}
    ports:
      - "${APP_PORT:-81}:81"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:81/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
